# UIPTV EPG Builder Configuration
# Copy this file to ~/.uiptv/epg-builder/config.toml and customize

# Working directory for cache, locks, and temporary files
working_dir = "~/.uiptv/epg-builder"

# Global settings
dry_run = true          # Set to false to apply changes
force_refresh = false   # Force refresh all sources

# Source filters (optional)
include_sources = []    # Only process these source IDs
exclude_sources = []    # Skip these source IDs
region_filter = []      # Filter by country codes (e.g., ["US", "GB"])
language_filter = []    # Filter by language codes (e.g., ["en", "de"])

# Database location is always resolved by UIPTV; no database setting is needed.

# EPG Sources
[[sources]]
id = "slingtv-epg"
name = "Sling TV EPG (jasonramg)"
type = "xmltv_url"
url = "https://raw.githubusercontent.com/jasonramg/iptv-epg/main/epg/slingtv.xml.gz"
countries = ["US"]
languages = ["en"]
enabled = false
priority = 50
refresh_hours = 12
max_size_mb = 200
timeout_seconds = 60
decompress = true

[[sources]]
id = "xmltv-net-au"
name = "XMLTV.net (Australia)"
type = "xmltv_url"
url = "http://xmltv.net/xml_files/Sydney.xml"
countries = ["AU"]
languages = ["en"]
enabled = false
priority = 60
refresh_hours = 24
max_size_mb = 200
timeout_seconds = 60
decompress = true

[[sources]]
id = "catchup-tv-more"
name = "Catch-up TV & More XMLTV"
type = "xmltv_url"
url = "https://github.com/Catch-up-TV-and-More/xmltv/raw/master/xmltv.xml.gz"
countries = ["FR", "BE", "CH", "CA", "US", "GB"]
languages = ["fr", "en"]
enabled = false
priority = 65
refresh_hours = 12
max_size_mb = 150
timeout_seconds = 60
decompress = true

