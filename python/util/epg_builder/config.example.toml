# Matching configuration
[matching]
min_confidence = 0.85        # Minimum confidence for auto-match
margin_threshold = 0.10      # Required margin over runner-up
enable_fuzzy = true          # Enable fuzzy matching as last resort
quality_aliases = true       # Enable quality-neutral matching (HD/SD)
exact_id_first = true        # Try exact ID matches first
canonical_alias_first = true # Try canonical aliases first

# Collector configuration
[collector]
max_concurrent = 3           # Max concurrent source fetches
max_retries = 3              # Max retries per source
retry_backoff_seconds = 2.0  # Backoff between retries
user_agent = "UIPTV-EPG-Builder/0.1.0"
verify_ssl = true
follow_redirects = true
max_redirects = 5

# Java Bridge configuration
[bridge]
java_executable = "java"
# bridge_jar = "/path/to/epg-bridge.jar"  # Or use classpath
# classpath = "/path/to/classes"
timeout_seconds = 120
jvm_args = ["-Xmx512m"]

# Logging configuration
[logging]
level = "INFO"
# file = "~/.uiptv/epg-builder/epg-builder.log"
max_size_mb = 10
backup_count = 5
redact_secrets = true

# Process lock configuration
[lock]
# lock_file = "~/.uiptv/epg-builder/epg-builder.lock"
timeout_seconds = 300