configVideoPlayersHelpTitle=Видеоплееры
configFiltersHelpTitle=Родительский замок
configFiltersHelpText=Используйте этот раздел, чтобы скрыть категории и каналы по ключевым словам и защитить эти правила паролем.\n\n• Ключевые слова заблокированных категорий скрывают соответствующие названия категорий.\n\n• Ключевые слова заблокированных каналов скрывают соответствующие имена каналов.\n\n• Установите пароль родительской блокировки, если вы не хотите, чтобы другие пользователи читали, изменяли или временно приостанавливали эти фильтры.\n\n• Когда блокировка активна, UIPTV также может запрашивать пароль перед открытием контента, который портал «Сталкер» помечает как подвергнутый цензуре.\n\nИспользуйте широкие ключевые слова осторожно. Короткие или общие слова могут скрыть гораздо больше контента, чем ожидалось.\n\n• Длительность разблокировки определяет, как долго доступ остаётся открытым до восстановления защиты. Отключение защиты паролем удаляет пароль после подтверждения; для установки или смены используйте кнопку пароля.
configThemeHelpTitle=Тема и внешний вид
configDatabaseSyncHelpTitle=Резервное копирование и восстановление
configDatabaseSyncHelpText=Создать резервную копию записывает полный архив UIPTV с метаданными и файлом базы данных. Архив можно восстановить на настольной версии или Android.\n\n• Восстановить резервную копию заменяет локальную базу данных этой установки выбранным архивом.\n\n• Настольная версия также принимает старый необработанный файл UIPTV .db для восстановления, но новые копии сохраняются как архивы .zip.\n\n• Удаленный режим по-прежнему выполняет одностороннюю синхронизацию между компьютерами и может включать учетные записи, избранное и необязательные данные конфигурации.\n\n• Для удаленной синхронизации другой компьютер должен быть доступен и одобрен до передачи данных.\n\n• В удалённом режиме укажите хост и порт и проверьте подключение; другая машина должна одобрить передачу. Синхронизация конфигурации включает общие настройки. Синхронизация путей внешних проигрывателей также передаёт эти пути, если включена синхронизация конфигурации.
configTmdbMetadataHelpTitle=Метаданные TMDB
configTmdbMetadataHelpText=Добавьте сюда токен доступа для чтения TMDB, если вы хотите, чтобы UIPTV получал более полные метаданные для фильмов и сериалов.\n\n• Метаданные TMDB могут включать локализованные названия, сюжеты, жанры, ссылки на произведения искусства и другие описательные детали.\n\n• Токен является необязательным. UIPTV по-прежнему может воспроизводить контент без него, но охват метаданных будет более ограниченным.\n\n• Используйте ссылку руководства, если вам нужны инструкции по созданию учетной записи API TMDB, и используйте ссылку учетной записи, чтобы скопировать существующий токен доступа для чтения.\n\n• Если результаты метаданных выглядят неправильно, убедитесь, что токен действителен и что выбранный язык пользовательского интерфейса соответствует ожидаемому языку метаданных.\n\nОтноситесь к токену как к личным учетным данным и замените его, если считаете, что он был передан случайно.
categoryRemoveSelectedFromCache=Удалить выбранные категории из кэша
