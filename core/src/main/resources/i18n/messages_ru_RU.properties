autoEmbeddedPlayerUnavailable=Встроенный плеер недоступен, так как VLC не удалось запустить. Используйте внешний медиаплеер или правильно установите VLC, затем попробуйте снова.
configWebServer=Внутренний веб-сервер
configWebServerHelpTitle=Внутренний веб-сервер
configWebServerHelpText=Используйте этот раздел для запуска локальных веб-инструментов UIPTV.\n\nВнутренний веб-сервер публикует веб-приложение, браузерное воспроизведение, DRM-браузерный запасной вариант, публикацию плейлистов и маршруты удалённой синхронизации.\n\nПорт сервера должен быть свободен на этом компьютере. Если вы его измените, используйте новый адрес везде, где происходит локальное подключение к UIPTV.\n\nПубликация плейлиста M3U8 создаёт локальную конечную точку плейлиста, которую другие плееры или инструменты могут открыть во время работы UIPTV.\n\n• Автозапуск сервера запускает его при открытии UIPTV; кнопки запуска и остановки управляют текущим сеансом. Прокси браузерного потока при необходимости передаёт воспроизведение через UIPTV. Ссылки HTTP и HTTPS открывают настроенные порты.
configVideoPlayersHelp=Настройте до трёх внешних видеоплееров и выберите, как UIPTV открывает потоки.\n\nПути к основному, второстепенному и третьему плеерам должны указывать на фактический исполняемый файл каждого настольного плеера.\n\nВыбранный плеер по умолчанию — это первый вариант, который UIPTV использует для обычного воспроизведения. Если этот плеер недоступен, UIPTV может перейти к другому настроенному варианту.\n\nВстроенный плеер сохраняет воспроизведение внутри UIPTV, когда VLC доступен. Если VLC не может быть запущен, используйте внешний плеер или установите VLC правильно.\n\nВеб-браузерный плеер полезен для DRM-защищённых потоков или сервисов, которые надёжно работают только в браузере.\n\nШирокий вид увеличивает область встроенного плеера, а Разрешать цепочки перенаправлений помогает, когда провайдер использует HLS-мастер-плейлисты, короткие ссылки или многоэтапные перенаправления.\n\n• В параметрах VLC настраиваются сетевой и эфирный кэш, HTTP user agent и cookies, переподключение, адаптивный доступ, заголовок и тихий режим, видеовыход и аппаратное ускорение. Сохранить применяет настройки, а сброс возвращает значения по умолчанию.
configThemeHelp=Используйте этот раздел для управления встроенным внешним видом UIPTV.\n\nТема переключается между встроенными светлыми и тёмными палитрами или следует настройке операционной системы.\n\nВидеоминиатюры могут улучшить просмотр, но их отключение может уменьшить визуальный шум и помочь более медленным системам.\n\nЯзык меняет язык интерфейса для меню, меток и диалогов.\n\nМасштаб интерфейса изменяет масштаб интерфейса. Увеличьте его на экранах с высоким разрешением или когда вы хотите более крупные элементы управления и текст.\n\n• Режим обычного текста скрывает миниатюры; отключите его, чтобы показывать их. EPG включает или выключает данные телепрограммы. Параметр отображения счётчиков показывает общее число закладок и аккаунтов рядом с пунктами навигации.\n\n• Срок хранения кэша задаёт, сколько дней сохраняются данные. В меню очистки можно удалить кэш воспроизведения, историю «Смотрю сейчас» или недавние избранное.
