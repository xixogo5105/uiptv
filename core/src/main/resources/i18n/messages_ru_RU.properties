categoryRemoveCachedConfirmMessage=Вы собираетесь удалить {0} категорий из кэша. Кэшированные {1} в этих категориях также будут удалены. Избранное и записи Сейчас смотрю останутся. Обновите кэш этой учетной записи, чтобы вернуть категории. Нажмите OK для удаления.
