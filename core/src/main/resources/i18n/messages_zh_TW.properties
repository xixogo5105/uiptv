autoEmbeddedPlayerUnavailable=內嵌播放器無法使用，因為無法啟動 VLC。請使用外部媒體播放器或正確安裝 VLC，然後重試。
configWebServer=內部 Web 伺服器
configWebServerHelpTitle=內部 Web 伺服器
configWebServerHelpText=使用此部分來執行 UIPTV 的本地 Web 工具。\n\n內部 Web 伺服器發佈 Web 應用程式、瀏覽器播放、DRM 瀏覽器後援、播放清單發佈和遠端同步路由。\n\n伺服器連接埠在此電腦上必須可用。如果您變更它，請在本地連線到 UIPTV 的任何地方使用新位址。\n\n發佈 M3U8 播放清單會建立一個本端播放清單端點，其他播放器或工具可以在 UIPTV 執行時開啟它。\n\n• 啟動時自動執行伺服器會在 UIPTV 開啟時啟動伺服器；啟動或停止用於控制目前工作階段。瀏覽器串流 Proxy 會在需要時透過 UIPTV 轉送瀏覽器播放。HTTP 和 HTTPS 連結會開啟已設定的連接埠。
configVideoPlayersHelp=設定最多三個外部影片播放器並選擇 UIPTV 如何開啟串流。\n\n主要、次要和第三播放器的路徑應指向每個桌面播放器的實際可執行檔。\n\n所選的預設播放器是 UIPTV 用於正常播放的第一個選項。如果該播放器無法使用，UIPTV 可以回復到另一個設定的選項。\n\n內嵌播放器在 VLC 可用時於 UIPTV 內保持播放。如果無法啟動 VLC，請使用外部播放器或正確安裝 VLC。\n\nWeb 瀏覽器播放器對於 DRM 保護串流或僅在瀏覽器中可靠運作的服務很有用。\n\n寬視角會放大內嵌播放器區域，而解析重定向鏈在提供者使用 HLS 主要播放清單、短連結或多級重定向時會有幫助。\n\n• VLC 選項可設定網路與直播快取、HTTP 使用者代理程式與 Cookie、重新連線、自適應存取、標題顯示與靜音模式、視訊輸出和硬體加速。儲存會套用設定；重設預設值會還原初始值。
configThemeHelp=使用此部分控制 UIPTV 的內建外觀。\n\n主題在應用程式的內建淺色與深色調色盤之間切換，或跟隨作業系統設定。\n\n影片縮圖可以改善瀏覽，但停用它們可以減少視覺混亂並幫助較慢的系統。\n\n語言會變更選單、標籤和對話方塊的 UI 語言。\n\nUI 縮放會變更介面的比例。在高解析度顯示器上或當您想要更大的控制和文字時增加它。\n\n• 純文字模式會隱藏縮圖；關閉此模式即可顯示縮圖。EPG 用於啟用或停用節目指南資料。顯示書籤和帳戶數量會在對應的導覽標籤旁顯示總數。\n\n• 快取期限設定快取資料保留的天數。「清除」選單可刪除播放快取、「正在觀看」歷史或最近的書籤。
