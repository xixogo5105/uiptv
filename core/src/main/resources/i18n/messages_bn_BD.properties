autoEmbeddedPlayerUnavailable=VLC শুরু করা যায়নি বলে এম্বেডেড প্লেয়ার পাওয়া যাচ্ছে না। একটি বাহ্যিক মিডিয়া প্লেয়ার ব্যবহার করুন বা VLC সঠিকভাবে ইনস্টল করুন, তারপরে আবার চেষ্টা করুন।
configWebServer=অভ্যন্তরীণ ওয়েব সার্ভার
configWebServerHelpTitle=অভ্যন্তরীণ ওয়েব সার্ভার
configWebServerHelpText=UIPTV-এর স্থানীয় ওয়েব টুল চালাতে এই অংশটি ব্যবহার করুন।\n\nঅভ্যন্তরীণ ওয়েব সার্ভার ওয়েব অ্যাপ, ব্রাউজার প্লেব্যাক, DRM ব্রাউজার ফলব্যাক, প্লেলিস্ট পাবলিশ এবং রিমোট সিঙ্ক রুট প্রকাশ করে।\n\nসার্ভার পোর্ট এই কম্পিউটারে মুক্ত থাকতে হবে। আপনি যদি এটি পরিবর্তন করেন, তবে UIPTV-এ স্থানীয়ভাবে সংযোগ করা যেকোনো জায়গায় নতুন ঠিকানা ব্যবহার করুন।\n\nM3U8 প্লেলিস্ট প্রকাশ করা অন্যান্য প্লেয়ার বা টুল যা UIPTV চালিয়ে যাওয়ার সময় খুলতে পারে স্থানীয় প্লেলিস্ট এন্ডপয়েন্ট তৈরি করে।\n\n• Automatically run server on startup UIPTV খোলার সময় সার্ভার চালায়; Start বা Stop বর্তমান সেশন নিয়ন্ত্রণ করে। Enable browser stream proxy প্রয়োজনে ব্রাউজার প্লেব্যাক UIPTV-এর মাধ্যমে চালায়। HTTP ও HTTPS লিংক নির্ধারিত পোর্ট খোলে।
configVideoPlayersHelp=তিনটি পর্যন্ত বাহ্যিক ভিডিও প্লেয়ার কনফিগার করুন এবং UIPTV কীভাবে স্ট্রিম খুলবে তা বেছে নিন।\n\n- প্রাথমিক, মাধ্যমিক ও তৃতীয় প্লেয়ারের পথগুলি প্রতিটি ডেস্কটপ প্লেয়ারের প্রকৃত এক্সিকিউটেবলের দিকে নির্দেশ করা উচিত।\n\n- নির্বাচিত ডিফল্ট প্লেয়ারটি স্বাভাবিক প্লেব্যাকের জন্য UIPTV যে প্রথম বিকল্পটি ব্যবহার করে। প্লেয়ারটি না পাওয়া গেলে UIPTV অন্য কনফিগার করা বিকল্পে ফিরতে পারে।\n\n- এম্বেডেড প্লেয়ার VLC উপলব্ধ থাকলে প্লেব্যাক UIPTV-এর ভেতরেই থাকে। VLC শুরু করা না গেলে বাহ্যিক প্লেয়ার ব্যবহার করুন বা VLC সঠিকভাবে ইনস্টল করুন।\n\n- ওয়েব ব্রাউজার প্লেয়ার DRM-সুরক্ষিত স্ট্রিম বা শুধুমাত্র ব্রাউজারে নির্ভরযোগ্যভাবে কাজ করে এমন পরিষেবার জন্য কার্যকর।\n\n- ওয়াইড ভিউ এম্বেডেড প্লেয়ারের এলাকা বড় করে, আর রিসলভ রিডাইরেক্ট চেইন সাহায্য করে যখন কোনো প্রোভাইডার HLS মাস্টার প্লেলিস্ট, ছোট লিংক বা একাধিক ধাপের রিডাইরেক্ট ব্যবহার করে।\n\n• VLC Options-এ নেটওয়ার্ক ও লাইভ বাফারিং, HTTP ইউজার এজেন্ট ও কুকি, পুনঃসংযোগ, অ্যাডাপ্টিভ অ্যাক্সেস, শিরোনাম ও নীরব মোড, ভিডিও আউটপুট এবং হার্ডওয়্যার অ্যাক্সেলারেশন নিয়ন্ত্রণ করা যায়। Save পরিবর্তন প্রয়োগ করে; Reset Defaults ডিফল্ট ফিরিয়ে আনে।
configThemeHelp=UIPTV-এর ইনবিল্ট আচরণ নিয়ন্ত্রণের জন্য এই অংশটি ব্যবহার করুন।\n\nথিম অ্যাপটিকে ইনবিল্ট লাইট ও ডার্ক প্যালেটের মধ্যে বদলায়, অথবা অপারেটিং সিস্টেমের সেটিং অনুসরণ করে।\n\nভিডিও থাম্বনেইল ব্রাউজিং উন্নত করতে পারে, কিন্তু এটি অক্ষম করা দৃশ্য অ Botswana এবং ধীর সিস্টেমের সাহায্য করতে পারে।\n\nভাষা মেন্যু, লেবেল এবং ডায়লগের জন্য UI ভাষা পরিবর্তন করে।\n\nUI জুম ইন্টারফেসের স্কেল পরিবর্তন করে। উচ্চ রেজোলিউশন ডিসপ্লে বা যখন আপনি বড় কন্ট্রোল এবং টেক্সট চান তখন এটি বাড়ান।\n\n• প্লেইন টেক্সট মোড থাম্বনেইল লুকায়; সেগুলো দেখাতে এটি বন্ধ করুন। EPG চালু বা বন্ধ করলে প্রোগ্রাম গাইডের তথ্য নিয়ন্ত্রণ হয়, আর পছন্দের তালিকা ও অ্যাকাউন্টের সংখ্যা দেখানোর বিকল্পটি নেভিগেশন লেবেলের পাশে মোট সংখ্যা দেখায়।\n\n• ক্যাশের মেয়াদ কত দিন ক্যাশ করা ডেটা রাখা হবে তা নির্ধারণ করে। Clear মেনু থেকে প্লেব্যাক ক্যাশে, Watching Now ইতিহাস বা সাম্প্রতিক পছন্দের তালিকা মুছে ফেলা যায়।
