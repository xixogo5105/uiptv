configVideoPlayersHelpTitle=ভিডিও প্লেয়ার
configFiltersHelpTitle=প্যারেন্টাল লক
configFiltersHelpText=কীওয়ার্ড দ্বারা বিভাগ এবং চ্যানেল লুকিয়ে রাখতে এবং পাসওয়ার্ড দিয়ে সেই নিয়মগুলি রক্ষা করতে এই বিভাগটি ব্যবহার করুন।\n\n• ব্লক করা ক্যাটাগরি কীওয়ার্ড মিলে যাওয়া ক্যাটাগরির নামগুলো লুকিয়ে রাখে।\n\n• ব্লক করা চ্যানেল কীওয়ার্ড মিলিত চ্যানেলের নাম লুকায়।\n\n• আপনি যদি অন্য ব্যবহারকারীরা এই ফিল্টারগুলি পড়তে, পরিবর্তন করতে বা সাময়িকভাবে বিরতি দিতে না চান তবে একটি অভিভাবকীয় লক পাসওয়ার্ড সেট করুন৷\n\n• যখন লকটি সক্রিয় থাকে, তখন UIPTV-এর জন্য কন্টেন্ট খোলার আগে পাসওয়ার্ডের প্রয়োজন হতে পারে যা Stalker পোর্টাল সেন্সর করা হিসাবে চিহ্নিত করে।\n\nবিস্তৃত কীওয়ার্ড সাবধানে ব্যবহার করুন. সংক্ষিপ্ত বা সাধারণ শব্দ প্রত্যাশার চেয়ে অনেক বেশি বিষয়বস্তু লুকাতে পারে।\n\n• Unlock duration সুরক্ষা ফিরে আসার আগে কতক্ষণ প্রবেশাধিকার খোলা থাকবে তা নির্ধারণ করে। Disable password protection নিশ্চিত করার পর পাসওয়ার্ড সরায়; সেটি সেট বা বদলাতে password বোতাম ব্যবহার করুন।
configThemeHelpTitle=থিম এবং চেহারা
configDatabaseSyncHelpTitle=ব্যাকআপ ও পুনরুদ্ধার
configDatabaseSyncHelpText=ব্যাকআপ তৈরি করলে মেটাডেটা এবং ডাটাবেস ফাইলসহ একটি সম্পূর্ণ UIPTV ব্যাকআপ আর্কাইভ লেখা হয়। আর্কাইভটি ডেস্কটপ বা Android-এ পুনরুদ্ধার করা যায়।\n\n• ব্যাকআপ পুনরুদ্ধার এই ইনস্টলেশনের স্থানীয় ডাটাবেসকে নির্বাচিত ব্যাকআপ আর্কাইভ দিয়ে প্রতিস্থাপন করে।\n\n• ডেস্কটপ পুরোনো কাঁচা UIPTV .db ফাইলও পুনরুদ্ধারের জন্য গ্রহণ করে, তবে নতুন ব্যাকআপ .zip আর্কাইভ হিসেবে সংরক্ষিত হয়।\n\n• রিমোট মোড এখনও মেশিনগুলোর মধ্যে একমুখী সিঙ্ক করে এবং অ্যাকাউন্ট, পছন্দের তালিকা ও ঐচ্ছিক কনফিগারেশন ডেটা অন্তর্ভুক্ত করতে পারে।\n\n• রিমোট সিঙ্কের জন্য ডেটা স্থানান্তরের আগে অন্য মেশিনটি পৌঁছানোযোগ্য ও অনুমোদিত হতে হবে।\n\n• Remote মোডে হোস্ট ও পোর্ট লিখে সংযোগ পরীক্ষা করুন; অন্য মেশিনকে স্থানান্তর অনুমোদন করতে হবে। Sync Configuration দূরবর্তী সিঙ্কে শেয়ার করা সেটিংস যোগ করে; এটি চালু থাকলে Sync External Player Paths প্লেয়ারের পথও অন্তর্ভুক্ত করে।
configTmdbMetadataHelpTitle=TMDB মেটাডেটা
configTmdbMetadataHelpText=যদি আপনি UIPTV সিনেমা এবং সিরিজের জন্য আরও সমৃদ্ধ মেটাডেটা আনতে চান তাহলে এখানে একটি TMDB রিড অ্যাক্সেস টোকেন যোগ করুন।\n\n• TMDB মেটাডেটা স্থানীয় শিরোনাম, প্লট, জেনার, আর্টওয়ার্ক রেফারেন্স এবং অন্যান্য বর্ণনামূলক বিবরণ অন্তর্ভুক্ত করতে পারে।\n\n• টোকেন ঐচ্ছিক। UIPTV এখনও এটি ছাড়া সামগ্রী চালাতে পারে, তবে মেটাডেটা কভারেজ আরও সীমিত হবে।\n\n• যদি আপনার একটি TMDB API অ্যাকাউন্ট তৈরি করার জন্য নির্দেশাবলীর প্রয়োজন হয় তবে গাইড লিঙ্কটি ব্যবহার করুন এবং একটি বিদ্যমান পঠিত অ্যাক্সেস টোকেন অনুলিপি করতে অ্যাকাউন্ট লিঙ্কটি ব্যবহার করুন৷\n\n• যদি মেটাডেটা ফলাফলগুলি ভুল মনে হয়, তাহলে যাচাই করুন যে টোকেনটি বৈধ এবং নির্বাচিত UI ভাষা আপনার প্রত্যাশিত মেটাডেটা ভাষার সাথে মেলে৷\n\nটোকেনটিকে একটি ব্যক্তিগত শংসাপত্রের মতো বিবেচনা করুন এবং যদি আপনি বিশ্বাস করেন যে এটি ভুলবশত শেয়ার করা হয়েছে তবে এটি প্রতিস্থাপন করুন।
