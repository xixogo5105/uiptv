autoEmbeddedPlayerUnavailable=VLC ആരംഭിക്കാൻ കഴിയാത്തതിനാൽ എംബഡഡ് പ്ലേയർ ലഭ്യമല്ല. ബാഹ്യ മീഡിയ പ്ലേയർ ഉപയോഗിക്കുക അല്ലെങ്കിൽ VLC ശരിയായി ഇൻസ്റ്റാൾ ചെയ്യുക, തുടർന്ന് വീണ്ടും ശ്രമിക്കുക.
configWebServer=അന്തരീക്ഷ വെബ് സെർവ്വർ
configWebServerHelpTitle=അന്തരീക്ഷ വെബ് സെർവ്വർ
configWebServerHelpText=UIPTV-യുടെ പ്രാദേശിക വെബ് ഉപകരണങ്ങൾ പ്രവർത്തിപ്പിക്കാൻ ഈ ഭാഗം ഉപയോഗിക്കുക.\n\nഅന്തരീക്ഷ വെബ് സെർവ്വർ വെബ് ആപ്ലിക്കേഷൻ, ബ്രൗസർ പ്ലേബാക്ക്, DRM ബ്രൗസർ ഫോൾബാക്ക്, പ്ലേലിസ്റ്റ് പബ്ലിഷ്, റിമോട്ട് സിങ്ക് റൂട്ടുകൾ പ്രസിദ്ധീകരിക്കുന്നു.\n\nസെർവ്വർ പോർട്ട് ഈ മഷീൻ ലെ ഫ്രീ ആയിരിക്കണം. നിങ്ങൾ അത് മാറ്റിയാൽ, UIPTV-ക്ക് പ്രാദേശികമായി കണക്റ്റ് ചെയ്യപ്പെടുന്ന എല്ലാ இடங்கളിലും പുതിയ വിലാസം ഉപയോഗിക്കുക.\n\nM3U8 പ്ലേലിസ്റ്റ് പബ്ലിഷ് ചെയ്യുക UIPTV പ്രവർത്തിക്കുമ്പോൾ മറ്റ് പ്ലേയറുകൾ അല്ലെങ്കിൽ ഉപകരണങ്ങൾ തുറക്കാവുന്ന പ്രാദേശിക പ്ലേലിസ്റ്റ് എൻഡ്പോയിന്റ് സൃഷ്ടിക്കുന്നു.\n\n• Automatically run server on startup UIPTV തുറക്കുമ്പോൾ സെർവർ ആരംഭിക്കുന്നു; Start അല്ലെങ്കിൽ Stop നിലവിലെ സെഷൻ നിയന്ത്രിക്കുന്നു. Enable browser stream proxy ആവശ്യമെങ്കിൽ ബ്രൗസർ പ്ലേബാക്ക് UIPTV വഴി നടത്തുന്നു. HTTP, HTTPS ലിങ്കുകൾ ക്രമീകരിച്ച പോർട്ടുകൾ തുറക്കും.
configVideoPlayersHelp=മുന്നോടിയായി മൂന്ന് ബാഹ്യ വീഡിയോ പ്ലേയറുകൾ കൺഫിഗർ ചെയ്യുക, UIPTV സ്ട്രീമുകൾ എങ്ങനെ തുറക്കുന്നു തിരഞ്ഞെടുക്കുക.\n\nപ്രാഥമിക, രണ്ടാമൻ, മൂന്നാമൻ പ്ലേയർ പാതുകൾ ഓരോ ഡെസ്ക്‌ടോപ്പ് പ്ലേയറിന്റെയും യഥാർത്ഥ എക്സിക്യൂട്ടബിൾ ഫയലിലേക്കുള്ള സൂചന നൽകണം.\n\nതിരഞ്ഞെടുത്ത ഡിഫോൾട്ട് പ്ലേയർ UIPTV സാധാരണ പ്ലേബാക്ക് ഉപയോഗിക്കുന്ന ആദ്യ വികല്പം. ആ പ്ലേയർ ലഭ്യമല്ലെങ്കിൽ UIPTV മറ്റൊരു കൺഫിഗർ ചെയ്ത വികല്പത്തിലേക്ക് തിരിഞ്ഞേക്കാം.\n\nഎംബഡഡ് പ്ലേയർ VLC ലഭ്യമായാൽ UIPTV ഇൻഫ്രോ പ്ലേബാക്ക് നിലനിർത്തുന്നു. VLC ആരംഭിക്കാൻ കഴിയാത്തെങ്കിൽ, ബാഹ്യ പ്ലേയർ ഉപയോഗിക്കുക അല്ലെങ്കിൽ VLC ശരിയായി ഇൻസ്റ്റാൾ ചെയ്യുക.\n\nവെബ് ബ്രൗസർ പ്ലേയർ DRM പ്രതിരോധിത സ്ട്രീമുകൾ അല്ലെങ്കിൽ സേവനങ്ങൾ ഉപയോഗപ്രദമാണ് എന്നാൽ ബ്രൗസറിലും പ്രവർത്തിക്കുന്നു.\n\nവയറ്റ് വ്യൂ എംബഡഡ് പ്ലേയർ മേഖല വ്യാപകമാക്കി, റിഡിറക്റ്റ് ചെയ്ൻ പരിഹരിക്കുന്നത് നൽകുന്നവൻ HLS മാസ്റ്റർ പ്ലേലിസ്റ്റുകൾ, ചെറിയ ലിങ്കുകൾ അല്ലെങ്കിൽ ബാക്ക് ചെയ്യുന്ന റിഡിറക്റ്റുകൾ ഉപയോഗിക്കുമ്പോൾ സഹായിക്കുന്നു.\n\n• VLC Options നെറ്റ്‌വർക്ക്, ലൈവ് കാഷിംഗ്, HTTP user agent, cookies, reconnect, adaptive access, title display, quiet mode, video output, hardware acceleration എന്നിവ ക്രമീകരിക്കുന്നു. Save മാറ്റങ്ങൾ പ്രയോഗിക്കും; Reset Defaults മുൻകൂട്ടിയുള്ള മൂല്യങ്ങൾ പുനഃസ്ഥാപിക്കും.
configThemeHelp=UIPTV-യുടെ ആന്തരിക രൂപം നിയന്ത്രിക്കാൻ ഈ ഭാഗം ഉപയോഗിക്കുക.\n\nതീം ബിൽട്ട്-ഇൻ ലൈറ്റ്, ഡാർക്ക് പാലറ്റുകൾ തമുകൻ മാറുകയോ ഓപ്പറേറ്റിംഗ് സിസ്റ്റം സെറ്റിംഗ് പിന്തുടരുകയോ ചെയ്യും.\n\nവീഡിയോ ഥംബ്നെയിലുകൾ ബ്രൗസിംഗ് മെച്ചപ്പെടുത്താം, പക്ഷേ അവ നിർജ്ജീവമാക്കുന്നത് കാഴ്ചയുള്ള അഴവ് കുറയ്ക്കാനും സ്ലോ സിസ്റ്റങ്ങളിലും സഹായിക്കാനും സാധിക്കുന്നു.\n\nഭാഷ മെനൂകൾ, ലേബലുകൾ, ഡയലോഗുകൾക്കുള്ള UI ഭാഷ മാറ്റുന്നു.\n\nUI സൂം ഇന്റർഫേസിന്റെ അളവ് മാറ്റുന്നു. ഉയർന്ന റെസല്യൂഷൻ ഡിസ്പ്ലേകളിൽ വലിയ നിയന്ത്രണങ്ങളും ടെക്സ്റ്റും ആവശ്യമെങ്കിൽ വർധിപ്പിക്കുക.\n\n• പ്ലെയിൻ ടെക്സ്റ്റ് മോഡ് ലഘുചിത്രങ്ങൾ മറയ്ക്കുന്നു; അവ കാണിക്കാൻ ഇത് ഓഫാക്കുക. EPG പ്രോഗ്രാം ഗൈഡ് ഡാറ്റ പ്രവർത്തനക്ഷമമാക്കുകയോ പ്രവർത്തനരഹിതമാക്കുകയോ ചെയ്യുന്നു. ബുക്ക്മാർക്കും അക്കൗണ്ട് എണ്ണവും കാണിക്കുന്ന ഓപ്ഷൻ നാവിഗേഷൻ ലേബലുകൾക്കരികിൽ ആകെ എണ്ണം കാണിക്കും.\n\n• കാഷെ കാലാവധി സംഭരിച്ച ഡാറ്റ എത്ര ദിവസം സൂക്ഷിക്കണമെന്ന് നിശ്ചയിക്കുന്നു. Clear മെനുവിൽ നിന്ന് പ്ലേബാക്ക് കാഷെ, Watching Now ചരിത്രം, അല്ലെങ്കിൽ പുതിയ ബുക്ക്മാർക്കുകൾ മായ്ക്കാം.
