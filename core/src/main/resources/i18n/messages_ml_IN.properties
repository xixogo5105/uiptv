configVideoPlayersHelpTitle=വീഡിയോ പ്ലേയറുകൾ
configFiltersHelpTitle=രക്ഷാകർതൃ ലോക്ക്
configFiltersHelpText=കീവേഡ് മുഖേന വിഭാഗങ്ങളും ചാനലുകളും മറയ്‌ക്കാനും പാസ്‌വേഡ് ഉപയോഗിച്ച് ആ നിയമങ്ങൾ പരിരക്ഷിക്കാനും ഈ വിഭാഗം ഉപയോഗിക്കുക.\n\n• ബ്ലോക്ക് ചെയ്‌ത വിഭാഗ കീവേഡുകൾ പൊരുത്തപ്പെടുന്ന വിഭാഗത്തിൻ്റെ പേരുകൾ മറയ്‌ക്കുന്നു.\n\n• ബ്ലോക്ക് ചെയ്‌ത ചാനൽ കീവേഡുകൾ പൊരുത്തപ്പെടുന്ന ചാനൽ പേരുകൾ മറയ്ക്കുന്നു.\n\n• മറ്റ് ഉപയോക്താക്കൾ ഈ ഫിൽട്ടറുകൾ വായിക്കാനോ മാറ്റാനോ താൽക്കാലികമായി നിർത്താനോ ആഗ്രഹിക്കുന്നില്ലെങ്കിൽ ഒരു രക്ഷാകർതൃ ലോക്ക് പാസ്‌വേഡ് സജ്ജീകരിക്കുക.\n\n• ലോക്ക് സജീവമാകുമ്പോൾ, സ്റ്റാക്കർ പോർട്ടൽ സെൻസർ ചെയ്‌തതായി അടയാളപ്പെടുത്തുന്ന ഉള്ളടക്കം തുറക്കുന്നതിന് മുമ്പ് UIPTV-യ്ക്ക് പാസ്‌വേഡ് ആവശ്യമായി വരും.\n\nവിശാലമായ കീവേഡുകൾ ശ്രദ്ധാപൂർവ്വം ഉപയോഗിക്കുക. ഹ്രസ്വമോ പൊതുവായതോ ആയ വാക്കുകൾക്ക് പ്രതീക്ഷിച്ചതിലും കൂടുതൽ ഉള്ളടക്കം മറയ്ക്കാൻ കഴിയും.\n\n• Unlock duration സംരക്ഷണം തിരിച്ചെത്തുന്നതിന് മുമ്പ് പ്രവേശനം എത്ര നേരം തുറന്നിരിക്കുമെന്ന് നിശ്ചയിക്കുന്നു. Disable password protection സ്ഥിരീകരണത്തിന് ശേഷം പാസ്‌വേഡ് നീക്കും; അത് സജ്ജീകരിക്കാനോ മാറ്റാനോ password ബട്ടൺ ഉപയോഗിക്കുക.
configThemeHelpTitle=പ്രമേയവും രൂപഭാവവും
configDatabaseSyncHelpTitle=ബാക്കപ്പും പുനഃസ്ഥാപനവും
configDatabaseSyncHelpText=ബാക്കപ്പ് സൃഷ്ടിക്കുക മെറ്റാഡാറ്റയും ഡാറ്റാബേസ് ഫയലും അടങ്ങിയ പൂർണ്ണ UIPTV ബാക്കപ്പ് ആർക്കൈവ് എഴുതുന്നു. ആർക്കൈവ് ഡെസ്ക്ടോപ്പിലോ Android-ലോ പുനഃസ്ഥാപിക്കാം.\n\n• ബാക്കപ്പ് പുനഃസ്ഥാപിക്കുക ഈ ഇൻസ്റ്റലേഷന്റെ പ്രാദേശിക ഡാറ്റാബേസ് തിരഞ്ഞെടുത്ത ബാക്കപ്പ് ആർക്കൈവോടെ മാറ്റിസ്ഥാപിക്കുന്നു.\n\n• പുനഃസ്ഥാപനത്തിനായി പഴയ raw UIPTV .db ഫയലും ഡെസ്ക്ടോപ്പ് സ്വീകരിക്കും, പക്ഷേ പുതിയ ബാക്കപ്പുകൾ .zip ആർക്കൈവുകളായി സംരക്ഷിക്കും.\n\n• റിമോട്ട് മോഡ് മെഷീനുകൾക്കിടയിൽ ഒരുതരഫ് സിങ്ക് തുടരുകയും അക്കൗണ്ടുകൾ, ബുക്ക്മാർക്കുകൾ, ഐച്ഛിക കോൺഫിഗറേഷൻ ഡാറ്റ എന്നിവ ഉൾപ്പെടുത്തുകയും ചെയ്യും.\n\n• റിമോട്ട് സിങ്കിന് ഡാറ്റ കൈമാറുന്നതിന് മുമ്പ് മറ്റേ മെഷീൻ ലഭ്യവും അംഗീകരിച്ചതുമായിരിക്കണം.\n\n• Remote മോഡിൽ host, port നൽകി കണക്ഷൻ പരിശോധിക്കുക; കൈമാറ്റത്തിന് മറുവശത്തെ കമ്പ്യൂട്ടറിന്റെ അനുമതി വേണം. Sync Configuration പങ്കിട്ട ക്രമീകരണങ്ങൾ ഉൾപ്പെടുത്തുന്നു. അത് പ്രവർത്തനക്ഷമമായിരിക്കുമ്പോൾ Sync External Player Paths പ്ലെയർ പാതകളും ചേർക്കുന്നു.
configTmdbMetadataHelpTitle=TMDB മെറ്റാഡാറ്റ
configTmdbMetadataHelpText=സിനിമകൾക്കും സീരീസുകൾക്കുമായി യുഐപിടിവിക്ക് മികച്ച മെറ്റാഡാറ്റ ലഭിക്കണമെങ്കിൽ ഇവിടെ ഒരു TMDB റീഡ് ആക്‌സസ് ടോക്കൺ ചേർക്കുക.\n\n• TMDB മെറ്റാഡാറ്റയിൽ പ്രാദേശികവൽക്കരിച്ച ശീർഷകങ്ങൾ, പ്ലോട്ടുകൾ, വിഭാഗങ്ങൾ, കലാസൃഷ്‌ടി റഫറൻസുകൾ, മറ്റ് വിവരണാത്മക വിശദാംശങ്ങൾ എന്നിവ ഉൾപ്പെടാം.\n\n• ടോക്കൺ ഓപ്ഷണൽ ആണ്. UIPTV അത് കൂടാതെ ഉള്ളടക്കം പ്ലേ ചെയ്യാൻ കഴിയും, എന്നാൽ മെറ്റാഡാറ്റ കവറേജ് കൂടുതൽ പരിമിതമായിരിക്കും.\n\n• ഒരു TMDB API അക്കൗണ്ട് സൃഷ്‌ടിക്കുന്നതിന് നിങ്ങൾക്ക് നിർദ്ദേശങ്ങൾ ആവശ്യമുണ്ടെങ്കിൽ ഗൈഡ് ലിങ്ക് ഉപയോഗിക്കുക, നിലവിലുള്ള ഒരു റീഡ് ആക്‌സസ് ടോക്കൺ പകർത്താൻ അക്കൗണ്ട് ലിങ്ക് ഉപയോഗിക്കുക.\n\n• മെറ്റാഡാറ്റ ഫലങ്ങൾ തെറ്റായി തോന്നുന്നുവെങ്കിൽ, ടോക്കൺ സാധുതയുള്ളതാണെന്നും തിരഞ്ഞെടുത്ത UI ഭാഷ നിങ്ങൾ പ്രതീക്ഷിക്കുന്ന മെറ്റാഡാറ്റ ഭാഷയുമായി പൊരുത്തപ്പെടുന്നുണ്ടെന്നും പരിശോധിക്കുക.\n\nടോക്കൺ ഒരു സ്വകാര്യ ക്രെഡൻഷ്യൽ പോലെ പരിഗണിക്കുക, അത് ആകസ്മികമായി പങ്കിട്ടതാണെന്ന് നിങ്ങൾ വിശ്വസിക്കുന്നുവെങ്കിൽ അത് മാറ്റിസ്ഥാപിക്കുക.
categoryRemoveSelectedFromCache=തിരഞ്ഞെടുത്ത വിഭാഗങ്ങൾ കാഷിൽ നിന്ന് നീക്കം ചെയ്യുക
categoryRemoveCachedTitle=കാഷ് ചെയ്ത വിഭാഗങ്ങൾ നീക്കം ചെയ്യുക
categoryRemoveCachedConfirmMessage=നിങ്ങൾ {0} കാഷ് ചെയ്ത വിഭാഗങ്ങൾ നീക്കം ചെയ്യാൻ പോകുന്നു. ആ വിഭാഗങ്ങളിലെ കാഷ് ചെയ്ത {1} കൂടി നീക്കം ചെയ്യും. ബുക്ക്മാർക്കുകളും ഇപ്പോൾ കാണുന്നു എൻട്രികളും നിലനിൽക്കും. വിഭാഗങ്ങൾ തിരികെ കൊണ്ടുവരാൻ ഈ അക്കൗണ്ടിന്റെ കാഷ് പുതുക്കുക. നീക്കം ചെയ്യാൻ OK അമർത്തുക.
