configLightweightModeSwitchConfirm=ലഘു മോഡിലേക്ക് മാറുന്നത് ആപ്ലിക്കേഷൻ അടയ്ക്കും. ലഘു ഇന്റർഫേസ് ഉപയോഗിക്കാൻ UIPTV വീണ്ടും ആരംഭിക്കുക.\n\nലഘു മോഡ് വെബ് സർവ്വരും M3U8 പ്രക്ഷേപണവും മാത്രം നൽകുന്നു.\n\nതുടരാൻ ആഗ്രഹിക്കുന്നുണ്ടോ?
