autoEmbeddedPlayerUnavailable=Il lettore integrato non è disponibile perché VLC non si è avviato. Usa un lettore multimediale esterno o installa VLC correttamente, quindi riprova.
configWebServer=Server web interno
configWebServerHelpTitle=Server web interno
configWebServerHelpText=Use this section to run UIPTV's local web tools.\n\n- The internal web server publishes the web app, browser playback, DRM browser fallback, playlist publishing, and remote sync routes.\n\n- The server port must be free on this machine. If you change it, use the new address anywhere that connects to UIPTV locally.\n\n- Publish M3U8 Playlist creates a local playlist endpoint that other players or tools can open while UIPTV is running.\n\n- Auto-run server on startup starts the internal web server when UIPTV opens. Start/Stop controls the current server session. HTTP and HTTPS links open the running server at their configured ports.
configVideoPlayersHelp=Configura fino a tre lettori video esterni e scegli come UIPTV apre gli stream.\n\n- I percorsi del lettore primario, secondario e terziario devono puntare all'eseguibile effettivo di ciascun lettore desktop.\n\n- Il lettore predefinito selezionato è la prima opzione che UIPTV usa per la riproduzione normale. Se non è disponibile, UIPTV può ricadere su un'altra opzione configurata.\n\n- Il lettore integrato mantiene la riproduzione dentro UIPTV quando VLC è disponibile. Se VLC non si avvia, usa un lettore esterno o installa VLC correttamente.\n\n- Il lettore del browser web è utile per stream protetti da DRM o per servizi che funzionano affidabilmente solo in un browser.\n\n- La visualizzazione ampia ingrandisce l'area del lettore integrato, mentre la risoluzione delle catene di reindirizzamento aiuta quando un provider usa playlist master HLS, link brevi o reindirizzamenti in più passaggi.
configThemeHelp=Usa questa sezione per controllare l'aspetto integrato di UIPTV.\n\n- Il tema passa l'applicazione tra le tavolozze chiara e scura integrate, oppure segue l'impostazione del sistema operativo.\n\n- Le miniature dei video possono facilitare la navigazione, ma disattivarle riduce il disordine visivo e aiuta i sistemi più lenti.\n\n- La lingua cambia la lingua dell'interfaccia per menu, etichette e finestre di dialogo.\n\n- Lo zoom della interfaccia cambia la scala dell'interfaccia. Aumentalo su schermi ad alta risoluzione o quando desideri controlli e testo più grandi.\n\n- Enable EPG controls programme guides, Now/Next and guide downloads. Settings and the gear update the same saved switch; the web follows it. Android has its own enable switch.\n\n- Global EPG sources: enter one XMLTV URL or local file per line, in priority order. For example, add separate India, UK, USA and Australia feeds. Gzip is supported. Each channel tries provider/embedded EPG, account EPG, then the global feeds until a usable match is found.\n\n- Global sources and guide ID overrides transfer with backups or remote sync that includes configuration. Local file paths must be accessible on the receiving device; HTTP/HTTPS URLs work across devices.\n\n- Show bookmark and account counts displays totals alongside the corresponding navigation labels.
