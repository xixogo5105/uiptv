autoEmbeddedPlayerUnavailable=VLC ਸ਼ੁਰੂ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਿਆ ਇਸ ਲਈ ਐਮਬੈਡਡ ਪਲੇਅਰ ਉਪਲਬਧ ਨਹੀਂ ਹੈ। ਇੱਕ ਬਾਹਰੀ ਮੀਡੀਆ ਪਲੇਅਰ ਦੀ ਵਰਤੋਂ ਕਰੋ ਜਾਂ VLC ਨੂੰ ਸਹੀ ਢੰਗ ਨਾਲ ਇੰਸਟਾਲ ਕਰੋ, ਫਿਰ ਮੁੜ ਕੋਸ਼ਿਸ਼ ਕਰੋ।
configWebServer=ਅੰਦਰੂਨੀ ਵੈੱਬ ਸਰਵਰ
configWebServerHelpTitle=ਅੰਦਰੂਨੀ ਵੈੱਬ ਸਰਵਰ
configWebServerHelpText=UIPTV ਦੇ ਸਥਾਨੀਕ ਵੈੱਬ ਟੂਲ ਚਲਾਉਣ ਲਈ ਇਸ ਭਾਗ ਦੀ ਵਰਤੋਂ ਕਰੋ।\n\nਅੰਦਰੂਨੀ ਵੈੱਬ ਸਰਵਰ ਵੈੱਬ ਐਪ, ਬ੍ਰਾਊਜ਼ਰ ਪਲੇਬੈਕ, DRM ਬ੍ਰਾਊਜ਼ਰ ਫਾਲਬੈਕ, ਪਲੇਲਿਸਟ ਪਬਲਿਸ਼ ਅਤੇ ਰਿਮੋਟ ਸਿੰਕ ਰੂਟ ਪ੍ਰਕਾਸ਼ਿਤ ਕਰਦਾ ਹੈ।\n\nਸਰਵਰ ਪੋਰਟ ਇਸ ਮਸ਼ੀਨ 'ਤੇ ਖਾਲੀ ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ। ਜੇ ਤੁਸੀਂ ਇਸ ਨੂੰ ਬਦਲਦੇ ਹੋ, ਤਾਂ UIPTV ਨਾਲ ਸਥਾਨਕ ਤੌਰ 'ਤੇ ਕਨੈਕਟ ਹੋਣ ਵਾਲੇ ਕਿਸੇ ਵੀ ਜਗ੍ਹਾ ਨਵਾਂ ਪਤਾ ਵਰਤੋਂ।\n\nM3U8 ਪਲੇਲਿਸਟ ਪਬਲਿਸ਼ ਕਰਨ ਨਾਲ ਇੱਕ ਸਥਾਨੀਕ ਪਲੇਲਿਸਟ ਐਂਡਪੋਇੰਟ ਬਣਾਇਆ ਜਾਂਦਾ ਹੈ ਜਿਸ ਨੂੰ UIPTV ਚਲਾਉਂਦੇ ਸਮੇਂ ਦੂਜੇ ਪਲੇਅਰ ਜਾਂ ਟੂਲ ਖੋਲ ਸਕਦੇ ਹਨ।\n\n• Automatically run server on startup UIPTV ਖੁੱਲ੍ਹਣ ਤੇ ਸਰਵਰ ਚਲਾਉਂਦਾ ਹੈ; Start ਜਾਂ Stop ਮੌਜੂਦਾ ਸੈਸ਼ਨ ਸੰਭਾਲਦਾ ਹੈ। Enable browser stream proxy ਲੋੜ ਪੈਣ ਤੇ ਬ੍ਰਾਊਜ਼ਰ ਪਲੇਬੈਕ ਨੂੰ UIPTV ਰਾਹੀਂ ਭੇਜਦਾ ਹੈ। HTTP ਅਤੇ HTTPS ਲਿੰਕ ਨਿਰਧਾਰਤ ਪੋਰਟ ਖੋਲ੍ਹਦੇ ਹਨ।
configVideoPlayersHelp=ਤਿੰਨ ਤੱਕ ਬਾਹਰੀ ਵਿਡੀਓ ਪਲੇਅਰ ਕ Anand ਸੰਰਚਨਾ ਕਰੋ ਅਤੇ ਚੁਣੋ ਕਿ UIPTV ਸਟਰੀਮ ਨੂੰ ਕਿਵੇਂ ਖੋਲਦਾ ਹੈ।\n\nਪ੍ਰਾਥਮਿਕ, ਦੂਜੇ ਅਤੇ ਤੀਜੇ ਪਲੇਅਰ ਦੇ ਮਾਰਗ ਹਰ ਡੈਸਕਟਾਪ ਪਲੇਅਰ ਦੇ ਅਸਲ ਎ੱਜ਼ੀਕਿਊਟੇਬਲ ਫਾਈਲ ਦੀ ਓਰ ਇਸ਼ਾਰਾ ਕਰਨੇ ਚਾਹੀਦੇ ਹਨ।\n\nਚੁਣਿਆ ਡਿਫਾਲਟ ਪਲੇਅਰ ਉਹ ਪਹਿਲਾ ਵਿਕਲਪ ਹੈ ਜਿਸ ਦੀ UIPTV ਸਾਧਾਰਨ ਪਲੇਬੈਕ ਲਈ ਵਰਤੋਂ ਕਰਦਾ ਹੈ। ਜੇ ਉਹ ਪਲੇਅਰ ਉਪਲਬਧ ਨਹੀਂ ਹੈ, ਤਾਂ UIPTV ਦੂਸਰੇ ਕਨਫਿੱਗਰ ਕੀਤੇ ਵਿਕਲਪ 'ਤੇ ਵਾਪਸ ਜਾ ਸਕਦਾ ਹੈ।\n\nਐਮਬੈਡਡ ਪਲੇਅਰ VLC ਉਪਲਬਧ ਹੋਣ 'ਤੇ UIPTV ਦੇ ਅੰਦਰ ਪਲੇਬੈਕ ਬਣਾਈ ਰੱਖਦਾ ਹੈ। ਜੇ VLC ਨੂੰ ਸ਼ੁਰੂ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ, ਤਾਂ ਬਾਹਰੀ ਪਲੇਅਰ ਦੀ ਵਰਤੋਂ ਕਰੋ ਜਾਂ VLC ਨੂੰ ਸਹੀ ਢੰਗ ਨਾਲ ਇੰਸਟਾਲ ਕਰੋ।\n\nਵੈੱਬ ਬਰਾਊਜ਼ਰ ਪਲੇਅਰ DRM-ਸੁਰੱਖਿਤ ਸਟਰੀਮ ਜਾਂ ਸੇਵਾਵਾਂ ਲਈ ਲਾਭਦਾਇਕ ਹੈ ਜੋ ਸਿਰਫ਼ ਬਰਾਊਜ਼ਰ ਵਿੱਚ ਹੀ ਭਰੋਸੇਯੋਗ ਢੰਗ ਨਾਲ ਕੰਮ ਕਰਦੀਆਂ ਹਨ।\n\nਵਾਈਡ ਭੂਮਿਕਾ ਐਮਬੈਡਡ ਪਲੇਅਰ ਖੇਤਰ ਨੂੰ ਵੱਡਾ ਕਰਦੀ ਹੈ, ਅਤੇ ਰੀਡਾਇਰੈਕਟ ਚੇਨ ਹੱਲ ਕਰਨਾ ਜਦੋਂ ਕਿ ਕੋਈ ਪ੍ਰੋਵਾਈਡਰ HLS ਮਾਸਟਰ ਪਲੇਲਿਸਟ, ਛੋਟੇ ਲਿੰਕ ਜਾਂ ਮਲਟੀ-ਸਟੈਪ ਰੀਡਾਇਰੈਕਟ ਦੀ ਵਰਤੋਂ ਕਰਦਾ ਹੈ ਤਾਂ ਮਦਦ ਕਰਦਾ ਹੈ।\n\n• VLC Options ਵਿੱਚ ਨੈੱਟਵਰਕ ਅਤੇ ਲਾਈਵ ਕੈਸ਼ਿੰਗ, HTTP user agent ਅਤੇ cookies, reconnect, adaptive access, title ਅਤੇ quiet mode, video output ਅਤੇ hardware acceleration ਸੈੱਟ ਕਰੋ। Save ਬਦਲਾਅ ਲਾਗੂ ਕਰਦਾ ਹੈ; Reset Defaults ਮੂਲ ਮੁੱਲ ਵਾਪਸ ਕਰਦਾ ਹੈ।
configThemeHelp=UIPTV ਦੇ ਅੰਦਰੂਨੀ ਦਿੱਖ ਨੂੰ ਨਿਯੰਤਰਿਤ ਕਰਨ ਲਈ ਇਸ ਖੰਡ ਦੀ ਵਰਤੋਂ ਕਰੋ।\n\nਥੀਮ ਬਿਲਟ-ਇਨ ਲਾਈਟ ਅਤੇ ਡਾਰਕ ਪੈਲੇਟ ਵਿਚਕਾਰ ਬਦਲਦਾ ਹੈ, ਜਾਂ ਓਪਰੇਟਿੰਗ ਸਿਸਟਮ ਦੀ ਸੈਟਿੰਗ ਦੀ ਪਿਛਲੀ ਕਰਦਾ ਹੈ।\n\nਵਿਡੀਓ ਥੰਬਨੇਲ ਬਰਾਊਜ਼ਿੰਗ ਨੂੰ ਸੁਧਾਰ ਸਕਦੇ ਹਨ, ਪਰ ਉਹਨਾਂ ਨੂੰ ਅਸਮਰੱਥ ਕਰਨਾ ਦ੍ਰਿਸ਼ਟੀ ਗੜਬੱਡੀ ਘਟਾ ਸਕਦਾ ਹੈ ਅਤੇ ਹੌਲੀ ਸਿਸਟਮ ਦੀ ਮਦਦ ਕਰ ਸਕਦਾ ਹੈ।\n\nਭਾਸ਼ਾ ਮੀਨੂ, ਲੇਬਲ ਅਤੇ ਡਾਈਲਾਗ ਲਈ UI ਭਾਸ਼ਾ ਬਦਲਦੀ ਹੈ।\n\nUI ਜੂਮ ਇੰਟਰਫੇਸ ਦੇ ਪੈਮਾਨੇ ਨੂੰ ਬਦਲਦਾ ਹੈ। ਉੱਚ ਰੇਜੋਲੀਊਸ਼ਨ ਡਿਸਪਲੇ 'ਤੇ ਜਾਂ ਜਦੋਂ ਤੁਸੀਂ ਵੱਡੇ ਕੰਟਰੋਲ ਅਤੇ ਟੈਕਸਟ ਚਾਹੁੰਦੇ ਹੋ ਤਾਂ ਇਸ ਨੂੰ ਵਧਾਓ।\n\n• ਪਲੇਨ ਟੈਕਸਟ ਮੋਡ ਥੰਬਨੇਲ ਲੁਕਾਉਂਦਾ ਹੈ; ਉਨ੍ਹਾਂ ਨੂੰ ਵੇਖਣ ਲਈ ਇਸਨੂੰ ਬੰਦ ਕਰੋ। EPG ਪ੍ਰੋਗਰਾਮ ਗਾਈਡ ਡਾਟਾ ਚਾਲੂ ਜਾਂ ਬੰਦ ਕਰਦਾ ਹੈ। ਮਨਪਸੰਦ ਅਤੇ ਖਾਤਾ ਗਿਣਤੀ ਦਿਖਾਉਣ ਵਾਲਾ ਵਿਕਲਪ ਸੰਬੰਧਿਤ ਨੇਵੀਗੇਸ਼ਨ ਲੇਬਲਾਂ ਕੋਲ ਕੁੱਲ ਗਿਣਤੀ ਦਿਖਾਉਂਦਾ ਹੈ।\n\n• ਕੈਸ਼ ਮਿਆਦ ਦੱਸਦੀ ਹੈ ਕਿ ਸੰਭਾਲਿਆ ਡਾਟਾ ਕਿੰਨੇ ਦਿਨ ਰੱਖਿਆ ਜਾਵੇਗਾ। Clear ਮੀਨੂ ਤੋਂ ਪਲੇਬੈਕ ਕੈਸ਼, Watching Now ਇਤਿਹਾਸ ਜਾਂ ਹਾਲੀਆ ਮਨਪਸੰਦ ਮਿਟਾਏ ਜਾ ਸਕਦੇ ਹਨ।
