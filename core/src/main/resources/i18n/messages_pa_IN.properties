filterLockDisablePasswordWarning=ਪਾਸਵਰਡ ਸੁਰੱਖਿਆ ਨੂੰ ਅਸਮਰੱਥ ਕਰਨ ਨਾਲ ਇਸ ਡਿਵਾਈਸ 'ਤੇ ਮਾਤਾ-ਪਿਤਾ ਲਾਕ ਕੰਟਰੋਲ ਅਤੇ Stalker ਸੁਰੱਖਿਤ ਸਮੱਗਰੀ ਲਈ ਪਾਸਵਰਡ ਲੋੜ ਹਟ ਜਾਂਦੀ ਹੈ।
