configVideoPlayersHelpTitle=ਵੀਡੀਓ ਪਲੇਅਰ
configFiltersHelpTitle=ਮਾਪਿਆਂ ਦਾ ਲਾਕ
configFiltersHelpText=ਕੀਵਰਡ ਦੁਆਰਾ ਸ਼੍ਰੇਣੀਆਂ ਅਤੇ ਚੈਨਲਾਂ ਨੂੰ ਲੁਕਾਉਣ ਲਈ ਅਤੇ ਉਹਨਾਂ ਨਿਯਮਾਂ ਨੂੰ ਪਾਸਵਰਡ ਨਾਲ ਸੁਰੱਖਿਅਤ ਕਰਨ ਲਈ ਇਸ ਸੈਕਸ਼ਨ ਦੀ ਵਰਤੋਂ ਕਰੋ।\n\n• ਬਲੌਕ ਕੀਤੀ ਸ਼੍ਰੇਣੀ ਦੇ ਕੀਵਰਡ ਮੇਲ ਖਾਂਦੀਆਂ ਸ਼੍ਰੇਣੀਆਂ ਨੂੰ ਲੁਕਾਉਂਦੇ ਹਨ।\n\n• ਬਲੌਕ ਕੀਤੇ ਚੈਨਲ ਕੀਵਰਡ ਮੇਲ ਖਾਂਦੇ ਚੈਨਲ ਦੇ ਨਾਮ ਲੁਕਾਉਂਦੇ ਹਨ।\n\n• ਜੇਕਰ ਤੁਸੀਂ ਨਹੀਂ ਚਾਹੁੰਦੇ ਹੋ ਕਿ ਹੋਰ ਉਪਯੋਗਕਰਤਾ ਇਹਨਾਂ ਫਿਲਟਰਾਂ ਨੂੰ ਪੜ੍ਹਣ, ਬਦਲਣ ਜਾਂ ਅਸਥਾਈ ਤੌਰ 'ਤੇ ਰੋਕ ਦੇਣ ਤਾਂ ਇੱਕ ਮਾਤਾ-ਪਿਤਾ ਦਾ ਲਾਕ ਪਾਸਵਰਡ ਸੈੱਟ ਕਰੋ।\n\n• ਜਦੋਂ ਲਾਕ ਕਿਰਿਆਸ਼ੀਲ ਹੁੰਦਾ ਹੈ, ਤਾਂ UIPTV ਸਮੱਗਰੀ ਨੂੰ ਖੋਲ੍ਹਣ ਤੋਂ ਪਹਿਲਾਂ ਪਾਸਵਰਡ ਦੀ ਲੋੜ ਵੀ ਕਰ ਸਕਦਾ ਹੈ ਜਿਸਨੂੰ ਸਟਾਲਕਰ ਪੋਰਟਲ ਸੈਂਸਰ ਕੀਤਾ ਗਿਆ ਹੈ।\n\nਵਿਆਪਕ ਕੀਵਰਡਸ ਨੂੰ ਧਿਆਨ ਨਾਲ ਵਰਤੋ। ਛੋਟੇ ਜਾਂ ਆਮ ਸ਼ਬਦ ਉਮੀਦ ਨਾਲੋਂ ਬਹੁਤ ਜ਼ਿਆਦਾ ਸਮੱਗਰੀ ਨੂੰ ਲੁਕਾ ਸਕਦੇ ਹਨ।\n\n• Unlock duration ਦੱਸਦੀ ਹੈ ਕਿ ਸੁਰੱਖਿਆ ਮੁੜ ਲਾਗੂ ਹੋਣ ਤੋਂ ਪਹਿਲਾਂ ਪਹੁੰਚ ਕਿੰਨੀ ਦੇਰ ਖੁੱਲ੍ਹੀ ਰਹੇਗੀ। Disable password protection ਪੁਸ਼ਟੀ ਮਗਰੋਂ ਪਾਸਵਰਡ ਹਟਾਉਂਦਾ ਹੈ; ਇਸਨੂੰ ਸੈੱਟ ਜਾਂ ਬਦਲਣ ਲਈ password ਬਟਨ ਵਰਤੋ।
configThemeHelpTitle=ਥੀਮ ਅਤੇ ਦਿੱਖ
configDatabaseSyncHelpTitle=ਬੈਕਅੱਪ ਅਤੇ ਰੀਸਟੋਰ
configDatabaseSyncHelpText=ਬੈਕਅੱਪ ਬਣਾਓ ਮੈਟਾਡਾਟਾ ਅਤੇ ਡਾਟਾਬੇਸ ਫਾਈਲ ਵਾਲਾ ਪੂਰਾ UIPTV ਬੈਕਅੱਪ ਆਰਕਾਈਵ ਲਿਖਦਾ ਹੈ। ਆਰਕਾਈਵ ਡੈਸਕਟਾਪ ਜਾਂ Android ਤੇ ਰੀਸਟੋਰ ਕੀਤਾ ਜਾ ਸਕਦਾ ਹੈ।\n\n• ਬੈਕਅੱਪ ਰੀਸਟੋਰ ਕਰੋ ਇਸ ਇੰਸਟਾਲੇਸ਼ਨ ਦੇ ਸਥਾਨਕ ਡਾਟਾਬੇਸ ਨੂੰ ਚੁਣੇ ਬੈਕਅੱਪ ਆਰਕਾਈਵ ਨਾਲ ਬਦਲਦਾ ਹੈ।\n\n• ਡੈਸਕਟਾਪ ਪੁਰਾਣੀ raw UIPTV .db ਫਾਈਲ ਵੀ ਰੀਸਟੋਰ ਲਈ ਸਵੀਕਾਰ ਕਰਦਾ ਹੈ, ਪਰ ਨਵੇਂ ਬੈਕਅੱਪ .zip ਆਰਕਾਈਵ ਵਜੋਂ ਸੰਭਾਲੇ ਜਾਂਦੇ ਹਨ।\n\n• ਰਿਮੋਟ ਮੋਡ ਹਾਲੇ ਵੀ ਮਸ਼ੀਨਾਂ ਵਿਚਕਾਰ ਇਕ-ਪਾਸਾ ਸਿੰਕ ਕਰਦਾ ਹੈ ਅਤੇ ਖਾਤੇ, ਮਨਪਸੰਦ ਅਤੇ ਵਿਕਲਪੀ ਕਨਫਿਗਰੇਸ਼ਨ ਡਾਟਾ ਸ਼ਾਮਲ ਕਰ ਸਕਦਾ ਹੈ।\n\n• ਰਿਮੋਟ ਸਿੰਕ ਲਈ ਡਾਟਾ ਭੇਜਣ ਤੋਂ ਪਹਿਲਾਂ ਦੂਜੀ ਮਸ਼ੀਨ ਪਹੁੰਚਯੋਗ ਅਤੇ ਮਨਜ਼ੂਰ ਹੋਣੀ ਚਾਹੀਦੀ ਹੈ।\n\n• Remote ਮੋਡ ਵਿੱਚ host ਅਤੇ port ਦਿਓ ਅਤੇ ਕਨੈਕਸ਼ਨ ਜਾਂਚੋ; ਦੂਜੀ ਮਸ਼ੀਨ ਨੂੰ ਟ੍ਰਾਂਸਫਰ ਮਨਜ਼ੂਰ ਕਰਨਾ ਪਵੇਗਾ। Sync Configuration ਸਾਂਝੀਆਂ ਸੈਟਿੰਗਾਂ ਜੋੜਦਾ ਹੈ। Sync External Player Paths, configuration sync ਚਾਲੂ ਹੋਣ ਤੇ player paths ਵੀ ਸ਼ਾਮਲ ਕਰਦਾ ਹੈ।
configTmdbMetadataHelpTitle=TMDB ਮੈਟਾਡੇਟਾ
configTmdbMetadataHelpText=ਇੱਥੇ ਇੱਕ TMDB ਰੀਡ ਐਕਸੈਸ ਟੋਕਨ ਸ਼ਾਮਲ ਕਰੋ ਜੇਕਰ ਤੁਸੀਂ ਚਾਹੁੰਦੇ ਹੋ ਕਿ UIPTV ਫਿਲਮਾਂ ਅਤੇ ਸੀਰੀਜ਼ ਲਈ ਅਮੀਰ ਮੈਟਾਡੇਟਾ ਪ੍ਰਾਪਤ ਕਰੇ।\n\n• TMDB ਮੈਟਾਡੇਟਾ ਵਿੱਚ ਸਥਾਨਿਕ ਸਿਰਲੇਖ, ਪਲਾਟ, ਸ਼ੈਲੀਆਂ, ਆਰਟਵਰਕ ਹਵਾਲੇ, ਅਤੇ ਹੋਰ ਵਰਣਨਯੋਗ ਵੇਰਵੇ ਸ਼ਾਮਲ ਹੋ ਸਕਦੇ ਹਨ।\n\n• ਟੋਕਨ ਵਿਕਲਪਿਕ ਹੈ। UIPTV ਅਜੇ ਵੀ ਇਸ ਤੋਂ ਬਿਨਾਂ ਸਮੱਗਰੀ ਚਲਾ ਸਕਦਾ ਹੈ, ਪਰ ਮੈਟਾਡੇਟਾ ਕਵਰੇਜ ਵਧੇਰੇ ਸੀਮਤ ਹੋਵੇਗੀ।\n\n• ਜੇਕਰ ਤੁਹਾਨੂੰ ਇੱਕ TMDB API ਖਾਤਾ ਬਣਾਉਣ ਲਈ ਨਿਰਦੇਸ਼ਾਂ ਦੀ ਲੋੜ ਹੈ ਤਾਂ ਗਾਈਡ ਲਿੰਕ ਦੀ ਵਰਤੋਂ ਕਰੋ, ਅਤੇ ਮੌਜੂਦਾ ਰੀਡ ਐਕਸੈਸ ਟੋਕਨ ਨੂੰ ਕਾਪੀ ਕਰਨ ਲਈ ਖਾਤਾ ਲਿੰਕ ਦੀ ਵਰਤੋਂ ਕਰੋ।\n\n• ਜੇਕਰ ਮੈਟਾਡੇਟਾ ਨਤੀਜੇ ਗਲਤ ਲੱਗਦੇ ਹਨ, ਤਾਂ ਪੁਸ਼ਟੀ ਕਰੋ ਕਿ ਟੋਕਨ ਵੈਧ ਹੈ ਅਤੇ ਚੁਣੀ ਗਈ UI ਭਾਸ਼ਾ ਉਸ ਮੈਟਾਡੇਟਾ ਭਾਸ਼ਾ ਨਾਲ ਮੇਲ ਖਾਂਦੀ ਹੈ ਜਿਸਦੀ ਤੁਸੀਂ ਉਮੀਦ ਕਰਦੇ ਹੋ।\n\nਟੋਕਨ ਨੂੰ ਇੱਕ ਨਿੱਜੀ ਪ੍ਰਮਾਣ ਪੱਤਰ ਵਾਂਗ ਵਰਤੋ ਅਤੇ ਜੇਕਰ ਤੁਹਾਨੂੰ ਲੱਗਦਾ ਹੈ ਕਿ ਇਹ ਗਲਤੀ ਨਾਲ ਸਾਂਝਾ ਕੀਤਾ ਗਿਆ ਹੈ ਤਾਂ ਇਸਨੂੰ ਬਦਲ ਦਿਓ।
categoryRemoveSelectedFromCache=ਚੁਣੀਆਂ ਸ਼੍ਰੇਣੀਆਂ ਕੈਸ਼ ਤੋਂ ਹਟਾਓ
categoryRemoveCachedTitle=ਕੈਸ਼ ਕੀਤੀਆਂ ਸ਼੍ਰੇਣੀਆਂ ਹਟਾਓ
categoryRemoveCachedConfirmMessage=ਤੁਸੀਂ {0} ਕੈਸ਼ ਕੀਤੀਆਂ ਸ਼੍ਰੇਣੀਆਂ ਹਟਾਉਣ ਵਾਲੇ ਹੋ। ਇਨ੍ਹਾਂ ਸ਼੍ਰੇਣੀਆਂ ਵਿੱਚ ਕੈਸ਼ ਕੀਤੇ {1} ਵੀ ਹਟਾਏ ਜਾਣਗੇ। ਮਨਪਸੰਦ ਅਤੇ ਹੁਣ ਵੇਖ ਰਹੇ ਹੋ ਐਂਟਰੀਆਂ ਰਹਿਣਗੀਆਂ। ਸ਼੍ਰੇਣੀਆਂ ਵਾਪਸ ਲਿਆਉਣ ਲਈ ਇਸ ਖਾਤੇ ਦਾ ਕੈਸ਼ ਰਿਫ੍ਰੈਸ਼ ਕਰੋ। ਹਟਾਉਣ ਲਈ OK ਦਬਾਓ।
