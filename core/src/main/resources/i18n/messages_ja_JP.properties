autoEmbeddedPlayerUnavailable=VLC を起動できなかったため、埋め込みプレーヤーを使用できません。外部メディア プレーヤーを使用するか、VLC を正しくインストールしてから再試行してください。
configWebServer=内部 Web サーバー
configWebServerHelpTitle=内部 Web サーバー
configWebServerHelpText=このセクションを使用して、UIPTV のローカル Web ツールを実行します。\n\n内部 Web サーバーは、Web アプリ、ブラウザ再生、DRM ブラウザ フォールバック、再生リスト公開、リモート ルートを公開します。\n\nサーバー ポートは、このマシンで使用可能である必要があります。変更する場合は、UIPTV にローカルで接続する任意の場所で新しいアドレスを使用してください。\n\nM3U8 再生リストを公開すると、UIPTV の実行中に他のプレーヤーまたはツールが開けるローカル再生リスト エンドポイントが作成されます。\n\n• 起動時にサーバーを自動実行すると UIPTV の起動時にサーバーが開始します。開始／停止で現在のセッションを操作します。ブラウザーストリームプロキシは必要に応じてブラウザー再生を UIPTV 経由にします。HTTP／HTTPS リンクは設定済みのポートを開きます。
configVideoPlayersHelp=最大3つの外部ビデオプレーヤーを設定し、UIPTV がストリームを開く方法を選択します。\n\nプライマリ、セカンダリ、ターシャリ プレーヤーのパスは、各デスクトップ プレーヤーの実際の実行可能ファイルを指す必要があります。\n\n選択したデフォルト プレーヤーは、UIPTV が通常の再生に使用する最初のオプションです。そのプレーヤーが利用できない場合、UIPTV は別の設定済みオプションにフォールバックできます。\n\n埋め込みプレーヤーは、VLC が利用可能な場合に UIPTV 内で再生を維持します。VLC を起動できない場合は、外部プレーヤーを使用するか、VLC を正しくインストールしてください。\n\nWeb ブラウザ プレーヤーは、DRM 保護されたストリームやブラウザーでのみ確実に動作するサービスに役立ちます。\n\nワイドビューは埋め込みプレーヤー領域を拡大し、リダイレクト チェーンを解決すると、プロバイダーが HLS マスター再生リスト、短いリンク、または多段階リダイレクトを使用する場合に役立ちます。\n\n• VLC オプションでは、ネットワーク／ライブキャッシュ、HTTP ユーザーエージェントと Cookie、再接続、アダプティブアクセス、タイトル表示と静音モード、映像出力、ハードウェアアクセラレーションを設定できます。保存で適用し、既定値に戻すと初期設定に戻ります。
configThemeHelp=このセクションを使用して、UIPTV の組み込みの外観を制御します。\n\nテーマは組み込みのライト／ダークパレットを切り替えるか、OS の設定に従います。\n\nビデオ サムネイルは、ブラウジングを改善できますが、無効にすると視覚的な混乱が減り、低速なシステムの助けになります。\n\n言語は、メニュー、ラベル、ダイアログの UI 言語を変更します。\n\nUI ズームは、インターフェイスのスケールを変更します。高解像度のディスプレイで、または大きなコントロールとテキストが必要な場合に増やしてください。\n\n• プレーンテキストモードではサムネイルが非表示になります。表示するにはオフにしてください。EPG は番組表データの有効・無効を切り替えます。ブックマーク数とアカウント数を表示すると、対応するナビゲーション項目に合計が表示されます。\n\n• キャッシュの有効期間は、保存データを保持する日数です。「消去」メニューから再生キャッシュ、「視聴中」の履歴、最近のブックマークを削除できます。
configBrowserCompatibilityWarning=ブラウザーでの再生は、すべてのストリーム形式をサポートしていない場合があります。続行しますか？
