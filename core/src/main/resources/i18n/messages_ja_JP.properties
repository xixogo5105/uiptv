configVideoPlayersHelpTitle=ビデオプレーヤー
configFiltersHelpTitle=ペアレンタルロック
configFiltersHelpText=このセクションを使用して、キーワードによってカテゴリとチャネルを非表示にし、それらのルールをパスワードで保護します。\n\n• ブロックされたカテゴリのキーワードは、一致するカテゴリ名を非表示にします。\n\n• ブロックされたチャネル キーワードは、一致するチャネル名を非表示にします。\n\n• 他のユーザーがこれらのフィルターを読み取り、変更、一時停止できないようにするには、ペアレンタル ロックのパスワードを設定します。\n\n• ロックがアクティブな場合、UIPTV は、ストーカー ポータルが検閲済みとしてマークしたコンテンツを開く前にパスワードを要求することもできます。\n\n幅広いキーワードを慎重に使用してください。短い単語や一般的な単語では、予想よりもはるかに多くの内容が隠されている可能性があります。\n\n• ロック解除時間は、保護が戻るまでアクセスを開いたままにする時間です。パスワード保護を無効にすると確認後にパスワードが削除されます。パスワードボタンで設定または変更できます。
configThemeHelpTitle=テーマと外観
configDatabaseSyncHelpTitle=バックアップと復元
configDatabaseSyncHelpText=バックアップを作成すると、メタデータとデータベースファイルを含む完全な UIPTV バックアップアーカイブを書き出します。このアーカイブはデスクトップまたは Android で復元できます。\n\n• バックアップを復元すると、このインストールのローカルデータベースが選択したバックアップアーカイブで置き換えられます。\n\n• デスクトップでは復元用に古い生の UIPTV .db ファイルも受け付けますが、新しいバックアップは .zip アーカイブとして保存されます。\n\n• リモートモードは引き続きマシン間で一方向同期を行い、アカウント、ブックマーク、任意の設定データを含めることができます。\n\n• リモート同期では、データ転送前に相手機が到達可能で承認済みである必要があります。\n\n• リモートモードではホストとポートを入力して接続をテストします。転送には相手側の承認が必要です。「設定を同期」は共有設定を含めます。「外部プレーヤーのパスを同期」は設定同期が有効な場合にプレーヤーのパスも含めます。
configTmdbMetadataHelpTitle=TMDBメタデータ
configTmdbMetadataHelpText=UIPTV で映画やシリーズのより豊富なメタデータを取得する場合は、ここに TMDB 読み取りアクセス トークンを追加します。\n\n• TMDB メタデータには、ローカライズされたタイトル、プロット、ジャンル、アートワーク参照、その他の説明的な詳細を含めることができます。\n\n• トークンはオプションです。 UIPTV は、メタデータがなくてもコンテンツを再生できますが、メタデータの範囲はより制限されます。\n\n• TMDB API アカウントの作成手順が必要な場合はガイド リンクを使用し、既存の読み取りアクセス トークンをコピーするにはアカウント リンクを使用します。\n\n• メタデータの結果が間違っている場合は、トークンが有効であること、および選択した UI 言語が期待するメタデータ言語と一致することを確認してください。\n\nトークンをプライベート資格情報のように扱い、誤って共有されたと思われる場合は置き換えてください。
