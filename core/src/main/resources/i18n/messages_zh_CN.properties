configVideoPlayersHelpTitle=视频播放器
configFiltersHelpTitle=家长锁
configFiltersHelpText=使用此部分可以按关键字隐藏类别和频道，并使用密码保护这些规则。\n\n• 被阻止的类别关键字会隐藏匹配的类别名称。\n\n• 被阻止的频道关键字会隐藏匹配的频道名称。\n\n• 如果您不希望其他用户读取、更改或暂时暂停这些过滤器，请设置家长锁定密码。\n\n• 当锁定处于活动状态时，UIPTV 还可以在打开 Stalker 门户标记为已审查的内容之前要求输入密码。\n\n谨慎使用宽泛的关键词。简短或通用的单词可能隐藏比预期更多的内容。
configThemeHelpTitle=主题与外观
configCacheFilteringHelpTitle=缓存和会话数据
configCacheFilteringHelpText=此部分将临时播放数据与暂停当前配置的家长锁过滤的选项结合起来。\n\n• 暂停家长锁定限制会暂时禁用阻止规则，而不删除它们。\n\n• 缓存过期控制与播放相关的缓存数据在被视为过时之前保留的时间。\n\n• 清除播放缓存可删除缓存的流数据，并可在播放持续使用过时或损坏的媒体响应时提供帮助。\n\n• 清除立即观看历史记录会删除已保存的正在进行的观看列表。\n\n• 重新加载帐户数据缓存会在门户端数据发生更改并且当前本地缓存已过期时刷新缓存的帐户数据。
configDatabaseSyncHelpTitle=备份与恢复
configDatabaseSyncHelpText=创建备份会写入包含元数据和数据库文件的完整 UIPTV 备份归档。该归档可在桌面版或 Android 上恢复。\n\n• 恢复备份会用所选备份归档替换此安装的本地数据库。\n\n• 桌面版也接受较旧的原始 UIPTV .db 文件进行恢复，但新备份会保存为 .zip 归档。\n\n• 远程模式仍会在计算机之间执行单向同步，并可包含帐户、书签和可选配置数据。\n\n• 远程同步要求另一台计算机在传输数据前可访问并获得批准。
configTmdbMetadataHelpTitle=TMDB元数据
configTmdbMetadataHelpText=如果您希望 UIPTV 获取更丰富的电影和电视剧元数据，请在此处添加 TMDB 读取访问令牌。\n\n• TMDB 元数据可以包括本地化的标题、情节、流派、艺术作品参考和其他描述性细节。\n\n• 令牌是可选的。没有它，UIPTV 仍然可以播放内容，但元数据覆盖范围将更加有限。\n\n• 如果您需要创建TMDB API 帐户的说明，请使用指南链接，并使用帐户链接复制现有的读取访问令牌。\n\n• 如果元数据结果看起来不正确，请验证令牌是否有效以及所选的UI 语言是否与您期望的元数据语言匹配。\n\n将令牌视为私人凭证，如果您认为它已被意外共享，请将其替换。
