autoEmbeddedPlayerUnavailable=嵌入式播放器不可用，因为无法启动 VLC。请使用外部媒体播放器或正确安装 VLC，然后重试。
configWebServer=内部 Web 服务器
configWebServerHelpTitle=内部 Web 服务器
configWebServerHelpText=使用此部分运行 UIPTV 的本地 Web 工具。

- 内部 Web 服务器发布 Web 应用程序、浏览器播放、DRM 浏览器回退、播放列表发布和远程同步路由。

- 服务器端口必须在此计算机上可用。如果更改它，请在本地连接到 UIPTV 的任何地方使用新地址。

- 发布 M3U8 播放列表会创建一个本地播放列表端点，其他播放器或工具可以在 UIPTV 运行时打开它。
configVideoPlayersHelp=配置最多三个外部视频播放器并选择 UIPTV 如何打开流。

- 主要、次要和第三播放器的路径应指向每个桌面播放器的实际可执行文件。

- 所选默认播放器是 UIPTV 用于正常播放的第一个选项。如果该播放器不可用，UIPTV 可以回退到另一个配置的选项。

- 嵌入式播放器在 VLC 可用时在 UIPTV 内保持播放。如果无法启动 VLC，请使用外部播放器或正确安装 VLC。

- Web 浏览器播放器对于 DRM 保护流或仅在浏览器中可靠运行的服务很有用。

- 宽视角会放大嵌入式播放器区域，而解析重定向链在提供商使用 HLS 主播放列表、短链接或多级重定向时会有帮助。
configThemeHelp=使用此部分控制 UIPTV 的内置外观。

- 深色主题在应用程序的内置浅色和深色调色板之间切换。

- 视频缩略图可以改善浏览，但禁用它们可以减少视觉混乱并帮助较慢的系统。

- 语言更改菜单、标签和对话框的 UI 语言。

- UI 缩放更改界面的比例。在高分辨率显示器上或当您想要更大的控件和文本时增加它。
