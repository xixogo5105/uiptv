autoEmbeddedPlayerUnavailable=Le lecteur intégré n'est pas disponible car VLC n'a pas pu être démarré. Utilisez un lecteur multimédia externe ou installez VLC correctement, puis réessayez.
configWebServer=Serveur Web interne
configWebServerHelpTitle=Serveur Web interne
configWebServerHelpText=Utilisez cette section pour exécuter les outils Web locaux d'UIPTV.\n\nLe serveur Web interne publie l'application Web, la lecture dans le navigateur, la solution de secours DRM dans le navigateur, la publication de listes de lecture et les routes de synchronisation à distance.\n\nLe port du serveur doit être libre sur cette machine. Si vous le modifiez, utilisez la nouvelle adresse partout où vous vous connectez à UIPTV localement.\n\nPublier la liste de lecture M3U8 crée un point de terminaison de liste de lecture local que d'autres lecteurs ou outils peuvent ouvrir pendant l'exécution d'UIPTV.\n\n- Auto-run server on startup starts the internal web server when UIPTV opens. Start/Stop controls the current server session. HTTP and HTTPS links open the running server at their configured ports.
configVideoPlayersHelp=Configurez jusqu'à trois lecteurs vidéo externes et choisissez comment UIPTV ouvre les flux.\n\nLes chemins du lecteur principal, secondaire et tertiaire doivent pointer vers l'exécutable réel de chaque lecteur de bureau.\n\nLe lecteur par défaut sélectionné est la première option qu'UIPTV utilise pour la lecture normale. Si ce lecteur n'est pas disponible, UIPTV peut se rabattre sur une autre option configurée.\n\nLe Lecteur intégré conserve la lecture dans UIPTV lorsque VLC est disponible. Si VLC ne peut pas être démarré, utilisez un lecteur externe ou installez VLC correctement.\n\nLe Lecteur de navigateur Web est utile pour les flux protégés par DRM ou les services qui ne fonctionnent de manière fiable que dans un navigateur.\n\nLa Vue large agrandit la zone du lecteur intégré, et Résoudre les chaînes de redirection aide lorsqu'un fournisseur utilise des listes de lecture HLS maîtresses, des liens courts ou des redirections à plusieurs étages.
configThemeHelp=Utilisez cette section pour contrôler l'apparence intégrée d'UIPTV.\n\nLe thème alterne entre les palettes claires et sombres intégrées, ou suit le réglage du système d'exploitation.\n\nLes vignettes vidéo peuvent améliorer la navigation, mais leur désactivation peut réduire l'encombrement visuel et aider les systèmes plus lents.\n\nLa Langue change la langue de l'interface utilisateur pour les menus, les étiquettes et les boîtes de dialogue.\n\nLe Zoom de l'interface utilisateur modifie l'échelle de l'interface. Augmentez-le sur les écrans haute résolution ou lorsque vous souhaitez des commandes et du texte plus grands.\n\n- Enable EPG controls programme guides, Now/Next and guide downloads. Settings and the gear update the same saved switch; the web follows it. Android has its own enable switch.\n\n- Global EPG sources: enter one XMLTV URL or local file per line, in priority order. For example, add separate India, UK, USA and Australia feeds. Gzip is supported. Each channel tries provider/embedded EPG, account EPG, then the global feeds until a usable match is found.\n\n- Global sources and guide ID overrides transfer with backups or remote sync that includes configuration. Local file paths must be accessible on the receiving device; HTTP/HTTPS URLs work across devices.\n\n- Show bookmark and account counts displays totals alongside the corresponding navigation labels.
