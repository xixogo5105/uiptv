autoEmbeddedPlayerUnavailable=Embedded player is unavailable because VLC could not be started. Use an external media player or install VLC correctly, then try again.
configWebServer=Internal Web Server
configWebServerHelpTitle=Internal Web Server
configWebServerHelpText=Use this section to run UIPTV's local web tools.\n\n- HTTP and HTTPS set the local server ports. Open Web App links open the running server. HTTPS uses a locally generated self-signed certificate, which browsers may ask you to trust.\n\n- Automatically run server on startup starts the server when UIPTV opens. Start or Stop controls the current server session.\n\n- Enable browser stream proxy routes browser playback through UIPTV when needed.\n\n- Publish M3U8 creates a local playlist endpoint that other players or tools can open while UIPTV is running.\n\n- The server also provides the web app, browser playback, DRM browser fallback, and remote sync routes.
configVideoPlayersHelp=Choose one of the available playback options as the default.\n\n- External Players: Configure Player 1, 2, and 3 with the executable path for each player. Use the browse button to locate it, then select a player card to make it the default.\n\n- Embedded Player (VLC): Plays inside UIPTV when VLC is available. Options controls network and live buffering, HTTP user agent and cookies, title and quiet behavior, reconnection and adaptive access, video output, and hardware acceleration. Save applies the VLC settings; Reset Defaults restores them.\n\n- Web Browser Player: Opens streams in a browser for DRM-protected or browser-dependent services.\n\n- Wide View gives the embedded player more width. Resolve redirect chains probes HLS variants and redirects before playback, which may add startup delay.
configThemeHelp=Use this section to configure the app's appearance and related display options.\n\n- Theme chooses Light, Dark, or System.\n\n- Plain text mode hides video thumbnails; turn it off to show them.\n\n- Language changes UI text, and Zoom scales text and controls.\n\n- Enable EPG turns programme-guide features on or off.\n\n- Show bookmarks and account counts adds totals to the matching navigation labels.\n\n- Cache expiry sets how many days cached data is kept. The Clear menu can remove playback cache, Watching Now history, or recent bookmarks.
configBrowserCompatibilityWarning=Browser playback may not support every stream format. Continue?
