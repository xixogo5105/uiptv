configVideoPlayersHelpTitle=Video Players
configFiltersHelpTitle=Parental Lock
configFiltersHelpText=Use this section to hide categories and channels by keyword and to protect those rules with a password.\n\n• Parental lock access enables or pauses these restrictions. If a password is set, changing access requires unlocking first.\n\n• Blocked category keywords hide matching category names.\n\n• Blocked channel keywords hide matching channel names.\n\n• Set a parental lock password if you do not want other users to read, change, or temporarily pause these filters.\n\n• When the lock is active, UIPTV can also require the password before opening content that the Stalker portal marks as censored.\n\nUse broad keywords carefully. Short or generic words can hide much more content than expected.\n\n- Unlock duration sets how long password access remains unlocked before protection is restored.\n\n- Disable password protection removes the parental lock password after confirmation. Set or change the password with the password button.
configThemeHelpTitle=Theme and Appearance
configDatabaseSyncHelpTitle=Backup & Restore
configDatabaseSyncHelpText=Create Backup saves a full UIPTV backup archive. Restore Backup replaces this installation's local database with the selected archive. Use File to save or load an archive on this device, or Remote to send or receive backup data with another UIPTV machine.\n\n- In Remote mode, enter the host and port, then test the connection. The other machine must approve a transfer.\n\n- Sync Configuration includes shared configuration during remote sync. Sync External Player Paths also includes external player paths and is available when configuration sync is enabled.
configTmdbMetadataHelpTitle=TMDB Metadata
configTmdbMetadataHelpText=Add a TMDB read access token here if you want UIPTV to fetch richer metadata for movies and series.\n\n• TMDB metadata can include localized titles, plots, genres, artwork references, and other descriptive details.\n\n• The token is optional. UIPTV can still play content without it, but metadata coverage will be more limited.\n\n• Use the guide link if you need instructions for creating a TMDB API account, and use the account link to copy an existing read access token.\n\n• If metadata results look wrong, verify that the token is valid and that the selected UI language matches the metadata language you expect.\n\nTreat the token like a private credential and replace it if you believe it has been shared accidentally.
