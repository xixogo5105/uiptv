# SLF4J simple backend configuration.
#
# Third-party libraries - Jetty, vlcj, the SQLite driver - log straight to SLF4J and never pass
# through AppLog, so they ignore the --show-logs flag entirely and printed their startup banner
# (connector bindings, session workers, servlet context) on every launch. Without this file
# slf4j-simple defaults to INFO, which is why that output appeared unconditionally.
#
# WARN keeps genuine problems visible while silencing routine library chatter. Warnings and
# errors still reach the console.
#
# AppLog.setTerminalLoggingEnabled raises this to "info" when --show-logs (or headless/sync mode)
# is active. A system property takes precedence over this file in slf4j-simple, so that override
# works; see SimpleLoggerConfiguration.getStringProperty.
org.slf4j.simpleLogger.defaultLogLevel=warn
