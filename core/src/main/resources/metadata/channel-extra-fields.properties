# Shared desktop/Android ingestion policy. No commands, provider diagnostics, cmds or parent series arrays.
# EPG identities; VOD/series fallbacks (including Android releaseDate/genre/imdbUrl);
# image aliases used by logo resolution and saved episode rendering; Stalker category derivation.
channel=xmltv_id,epg_id,tvg-id,epg_channel_id,name,o_name,description,plot,overview,releaseDate,release_date,released,year,rating_imdb,rating,duration,runtime,time,genre,imdbUrl,stream_icon,cover_big,cover,screenshot_uri,movie_image,thumbnail,still_path,image,poster,category,category_name,genre_name,tv_genre
# Android episode snapshots also carry identity and artwork in their info object.
episode=id,episode_num,episodeNum,title,seriesTitle,season,container_extension,containerExtension,custom_sid,added,direct_source
episodeInfo=movieImage,durationSecs,duration_secs,durationSeconds,bitrate,tmdb_id,tmdb,imdb_id,releaseDate,air_date,imdb_rating,season
