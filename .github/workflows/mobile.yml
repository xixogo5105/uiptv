name: Mobile Android
env:
  ARTIFACT_RETENTION_DAYS: 7

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y gperf

      - name: Restore API 24 libmpv AAR
        id: libmpv-aar-cache
        uses: actions/cache@v6
        with:
          path: mobile/androidApp/libs/libmpv-android-api24.aar
          key: libmpv-api24-aar-${{ runner.os }}-v2-${{ hashFiles('scripts/build-mobile-with-libmpv.sh', 'scripts/libmpv-quiet-log.h', 'mobile/androidApp/build.gradle.kts') }}
          restore-keys: |
            libmpv-api24-aar-${{ runner.os }}-v2-

      - name: Package Android debug APK
        env:
          UIPTV_LIBMPV_REUSE_AAR: "1"
        run: ./scripts/build-mobile-with-libmpv.sh :androidApp:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: uiptv-mobile-debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
